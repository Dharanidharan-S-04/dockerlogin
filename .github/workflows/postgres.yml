name: "postgres-build"
on:
  push:
    branches: post

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
       - name: Checkout repo
         uses: actions/checkout@v3

       - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v2

       - name: Log in to Docker Hub
         uses: docker/login-action@v2
         with:
          username: ${{ secrets.ACTOR_DOCKER_HUB }}
          password: ${{ secrets.RELEASE_DOCKER_HUB }}
    
       - name: docker build
         run: docker build -t ${{ secrets.ACTOR_DOCKER_HUB }}/postgres:demo
       - name: docker push
         run: docker push ${{ secrets.ACTOR_DOCKER_HUB }}/postgres:demo

